name: ProjeHealthMonitor
options:
  bundleIdPrefix: com.oneoapps
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  ProjeHealthMonitor:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ProjeHealthMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oneoapps.projehealthmonitor
        PRODUCT_NAME: ProjeHealthMonitor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: ProjeHealthMonitor/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    info:
      path: ProjeHealthMonitor/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Proje Health Monitor
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: ""

  ProjeHealthMonitorTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ProjeHealthMonitorTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: ProjeHealthMonitor

schemes:
  ProjeHealthMonitor:
    build:
      targets:
        ProjeHealthMonitor: all
        ProjeHealthMonitorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ProjeHealthMonitorTests
