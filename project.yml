name: ProjeHealthMonitor
options:
  bundleIdPrefix: com.zext
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.2.0"

targets:
  ProjeHealthMonitor:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ProjeHealthMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zext.healthmonitor
        PRODUCT_MODULE_NAME: ProjeHealthMonitor
        PRODUCT_NAME: Health Mntr
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: ProjeHealthMonitor/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        # Hardened Runtime's library validation rejects loading Sparkle.framework at launch —
        # it's separately ad-hoc signed (from its own SPM release artifact) and, without a real
        # Team ID on either side, that never counts as a match. Since we don't notarize, Hardened
        # Runtime provides no benefit here anyway, only this breakage.
        ENABLE_HARDENED_RUNTIME: false
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Sparkle
      - package: KeyboardShortcuts
    info:
      path: ProjeHealthMonitor/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Health Mntr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "© 2026 Zext"
        SUFeedURL: https://github.com/zextcom/health_monitor_macos/releases/latest/download/appcast.xml
        SUScheduledCheckInterval: 86400
        SUEnableAutomaticChecks: true
        SUPublicEDKey: dhlccRKzcLzfJRxhDlLR6IFnBH7M2RyDGQvPspQFVLk=
        # Endpoints are arbitrary user-supplied URLs (including plain-HTTP internal/intranet
        # services), so per-domain ATS exceptions aren't workable — this app is a network utility
        # making outbound GET/TCP checks only, never rendering remote content, which is the
        # standard justification for the blanket exception.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  ProjeHealthMonitorTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ProjeHealthMonitorTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Health Mntr.app/Contents/MacOS/Health Mntr"
    dependencies:
      - target: ProjeHealthMonitor

  ProjeHealthMonitorUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ProjeHealthMonitorUITests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: ProjeHealthMonitor

schemes:
  ProjeHealthMonitor:
    build:
      targets:
        ProjeHealthMonitor: all
        ProjeHealthMonitorTests: [test]
        ProjeHealthMonitorUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ProjeHealthMonitorTests
        - ProjeHealthMonitorUITests
