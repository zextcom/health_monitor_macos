name: ProjeHealthMonitor
options:
  bundleIdPrefix: com.zext
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.2.0"

targets:
  ProjeHealthMonitor:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ProjeHealthMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zext.healthmonitor
        PRODUCT_MODULE_NAME: ProjeHealthMonitor
        PRODUCT_NAME: Health Mntr
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: ProjeHealthMonitor/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: ProjeHealthMonitor/ProjeHealthMonitor.entitlements
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          # Local dev builds stay ad-hoc/automatic — no Team ID needed to build and run locally.
          # Hardened Runtime is off here too: it would otherwise reject loading Sparkle.framework
          # (separately signed, from its own SPM release artifact) under an ad-hoc identity.
          CODE_SIGN_STYLE: Automatic
          ENABLE_HARDENED_RUNTIME: false
        Release:
          # Real signing (and Hardened Runtime, required for notarization) only for Release
          # builds — this is what CI's release workflow builds and notarizes. Sparkle's own XPC
          # services are signed with Sparkle's certificate, not ours, hence
          # com.apple.security.cs.disable-library-validation in the entitlements file above.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: 4MSY72K4VX
          ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - package: Sparkle
      - package: KeyboardShortcuts
    info:
      path: ProjeHealthMonitor/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Health Mntr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "© 2026 Zext"
        SUFeedURL: https://github.com/zextcom/health_monitor_macos/releases/latest/download/appcast.xml
        SUScheduledCheckInterval: 86400
        SUEnableAutomaticChecks: true
        SUPublicEDKey: dhlccRKzcLzfJRxhDlLR6IFnBH7M2RyDGQvPspQFVLk=
        # Endpoints are arbitrary user-supplied URLs (including plain-HTTP internal/intranet
        # services), so per-domain ATS exceptions aren't workable — this app is a network utility
        # making outbound GET/TCP checks only, never rendering remote content, which is the
        # standard justification for the blanket exception.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  ProjeHealthMonitorTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ProjeHealthMonitorTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Health Mntr.app/Contents/MacOS/Health Mntr"
    dependencies:
      - target: ProjeHealthMonitor

  ProjeHealthMonitorUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ProjeHealthMonitorUITests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: ProjeHealthMonitor

schemes:
  ProjeHealthMonitor:
    build:
      targets:
        ProjeHealthMonitor: all
        ProjeHealthMonitorTests: [test]
        ProjeHealthMonitorUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ProjeHealthMonitorTests
        - ProjeHealthMonitorUITests
