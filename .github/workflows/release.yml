name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ProjeHealthMonitor.xcodeproj -scheme ProjeHealthMonitor -derivedDataPath build

      # Standard GitHub-documented pattern for signing with a real Developer ID cert on a
      # hosted runner: decode the .p12 into a keychain scoped to this job only, and make it
      # the default so xcodebuild finds the identity without any other config.
      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"

          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          rm "$CERT_PATH"

      - name: Build (Release, Developer ID signed)
        run: |
          xcodebuild \
            -project ProjeHealthMonitor.xcodeproj \
            -scheme ProjeHealthMonitor \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            build

      # Xcode's build only re-signs the Sparkle.framework binary itself when embedding it (and
      # without a secure timestamp); the deeper nested executables it ships — Autoupdate,
      # Updater.app, and the two XPC services — are copied verbatim from Sparkle's own SPM
      # release artifact, still carrying Sparkle's own signature. Notarization rejects all of
      # that, so re-sign everything bottom-up with our own identity before submitting, then
      # re-sign the outer app bundle last since its signature covers everything inside it.
      - name: Re-sign Sparkle's bundled binaries
        run: |
          APP_PATH="build/Build/Products/Release/Health Mntr.app"
          SPARKLE_VERSIONED="$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B"
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "Using signing identity: $IDENTITY"

          SIGN_ARGS=(--force --options runtime --timestamp --sign "$IDENTITY")
          codesign "${SIGN_ARGS[@]}" "$SPARKLE_VERSIONED/XPCServices/Downloader.xpc"
          codesign "${SIGN_ARGS[@]}" "$SPARKLE_VERSIONED/XPCServices/Installer.xpc"
          codesign "${SIGN_ARGS[@]}" "$SPARKLE_VERSIONED/Autoupdate"
          codesign "${SIGN_ARGS[@]}" "$SPARKLE_VERSIONED/Updater.app"
          codesign "${SIGN_ARGS[@]}" "$APP_PATH/Contents/Frameworks/Sparkle.framework"
          codesign --force --options runtime --timestamp \
            --entitlements ProjeHealthMonitor/ProjeHealthMonitor.entitlements \
            --sign "$IDENTITY" "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize app
        env:
          API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_VBR3NDQ4H4.p8"
          echo "$API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"

          APP_PATH="build/Build/Products/Release/Health Mntr.app"
          SUBMISSION_ZIP="$RUNNER_TEMP/notarization-submission.zip"
          ditto -c -k --keepParent "$APP_PATH" "$SUBMISSION_ZIP"

          set +e
          NOTARIZE_OUTPUT=$(xcrun notarytool submit "$SUBMISSION_ZIP" \
            --key "$KEY_PATH" \
            --key-id VBR3NDQ4H4 \
            --issuer b27895dd-3a15-45ff-8789-e9358970f6a0 \
            --wait 2>&1)
          NOTARIZE_STATUS=$?
          echo "$NOTARIZE_OUTPUT"
          set -e

          SUBMISSION_ID=$(echo "$NOTARIZE_OUTPUT" | grep -m1 '^  id:' | awk '{print $2}')
          if [ $NOTARIZE_STATUS -ne 0 ] || echo "$NOTARIZE_OUTPUT" | grep -q "status: Invalid"; then
            echo "Notarization failed or was rejected — fetching the detailed log:"
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$KEY_PATH" \
              --key-id VBR3NDQ4H4 \
              --issuer b27895dd-3a15-45ff-8789-e9358970f6a0
            rm "$KEY_PATH" "$SUBMISSION_ZIP"
            exit 1
          fi

          xcrun stapler staple "$APP_PATH"
          rm "$KEY_PATH" "$SUBMISSION_ZIP"

      - name: Zip app
        id: zip
        run: |
          APP_PATH="build/Build/Products/Release/Health Mntr.app"
          ZIP_NAME="HealthMntr-${{ steps.version.outputs.tag }}.zip"
          mkdir -p release-archives
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release-archives/$ZIP_NAME"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Locate Sparkle CLI tools
        id: sparkle
        run: |
          BIN=$(find build/SourcePackages/artifacts -type d -path "*Sparkle/bin" | head -1)
          if [ -z "$BIN" ]; then
            echo "Could not locate Sparkle's bin directory after package resolution" >&2
            exit 1
          fi
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: Generate signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" | "${{ steps.sparkle.outputs.bin }}/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/" \
            release-archives

      - name: Create installer DMG
        id: dmg
        run: |
          APP_PATH="build/Build/Products/Release/Health Mntr.app"
          DMG_NAME="HealthMntr-${{ steps.version.outputs.tag }}.dmg"
          DMG_ROOT="$(mktemp -d)"
          cp -R "$APP_PATH" "$DMG_ROOT/"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create \
            -volname "Health Mntr" \
            -srcfolder "$DMG_ROOT" \
            -ov \
            -format UDZO \
            "release-archives/$DMG_NAME"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "release-archives/${{ steps.zip.outputs.zip_name }}" \
            "release-archives/${{ steps.dmg.outputs.dmg_name }}" \
            "release-archives/appcast.xml" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
