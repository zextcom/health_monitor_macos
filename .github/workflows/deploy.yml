name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/health.zext.dev
            git pull origin main

            # Backend
            cd backend
            pnpm install --frozen-lockfile
            pnpm run build
            npx drizzle-kit migrate
            pm2 restart health-api health-worker

            # Client (web export)
            cd ../client
            npm install
            npx expo export --platform web

            # Copy web build to nginx serving directory
            rm -rf /var/www/health.zext.dev/public/*
            cp -r dist/* /var/www/health.zext.dev/public/

            # Verify
            sleep 3
            curl -f http://localhost:3030/health || echo "Health check failed!"
            pm2 status
