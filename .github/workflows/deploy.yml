name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'client/**'
      - 'packages/**'

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build web client
        run: |
          pnpm install --frozen-lockfile
          cd client
          EXPO_PUBLIC_API_URL=https://health.zext.dev npx expo export --platform web

      - name: Deploy backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/health.zext.dev
            git pull origin main

            cd backend
            pnpm install --frozen-lockfile
            pnpm run build
            npx drizzle-kit migrate
            pm2 restart health-api health-worker

            sleep 3
            curl -f http://localhost:3030/health || echo "Health check failed!"
            pm2 status

      - name: Upload web client
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: client/dist/*
          target: /var/www/health.zext.dev/_client_upload
          strip_components: 2

      - name: Swap web client files
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            rm -rf /var/www/health.zext.dev/public/*
            cp -r /var/www/health.zext.dev/_client_upload/* /var/www/health.zext.dev/public/
            rm -rf /var/www/health.zext.dev/_client_upload
