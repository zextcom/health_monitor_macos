name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'client/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Build web client
        run: |
          pnpm install --frozen-lockfile
          cd client
          EXPO_PUBLIC_API_URL=https://health.zext.dev npx expo export --platform web

      - name: Deploy backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # `set -eu`: any failing step (pull, install, build, migrate) stops the deploy before the
          # restart and fails the job, instead of restarting onto a stale build and reporting green.
          # verify-deploy.sh then gates on /health answering 200 with pass/warn, on the running
          # releaseId matching the commit just pulled (proves the restarted process runs the new
          # code), and on both pm2 apps being online — it fails the job otherwise.
          script: |
            set -eu
            cd /var/www/health.zext.dev
            git pull origin main

            cd backend
            pnpm install --frozen-lockfile
            pnpm run build
            npx drizzle-kit migrate
            pm2 restart health-api health-worker

            if ! bash scripts/verify-deploy.sh http://localhost:3030 "$(git rev-parse HEAD)" 60; then
              pm2 logs health-api health-worker --lines 40 --nostream || true
              exit 1
            fi
            pm2 status

      # Clear any leftovers of an earlier, interrupted upload so they can't mix into this release.
      - name: Prepare web client upload
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            rm -rf /var/www/health.zext.dev/_client_upload

      - name: Upload web client
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: client/dist/*
          target: /var/www/health.zext.dev/_client_upload
          strip_components: 2

      # Checks the upload is complete (index.html + every asset it references), then goes live with
      # two directory renames (public → public.prev, upload → public) instead of emptying public/
      # and copying into it, so the site is never served empty or half-copied. The script comes
      # from the checkout the "Deploy backend" step just pulled.
      - name: Swap web client files
        id: swap
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            bash /var/www/health.zext.dev/client/scripts/web-client-release.sh swap /var/www/health.zext.dev

      # Checked from outside, the way a visitor sees it: the live index.html must reference this
      # build's entry bundle, and that bundle must load.
      - name: Verify web client
        run: bash client/scripts/verify-web-client.sh https://health.zext.dev client/dist 60

      - name: Roll back web client
        if: failure() && steps.swap.outcome == 'success'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            bash /var/www/health.zext.dev/client/scripts/web-client-release.sh rollback /var/www/health.zext.dev
