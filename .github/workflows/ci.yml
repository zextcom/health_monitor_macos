name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "No Xcode installation found on this runner" >&2
            exit 1
          fi
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated project is committed
        run: |
          git diff --exit-code -- ProjeHealthMonitor.xcodeproj || {
            echo "ProjeHealthMonitor.xcodeproj is out of sync with project.yml. Run 'xcodegen generate' and commit the result." >&2
            exit 1
          }

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ProjeHealthMonitor.xcodeproj -scheme ProjeHealthMonitor -derivedDataPath build

      - name: Run tests
        run: |
          xcodebuild test \
            -project ProjeHealthMonitor.xcodeproj \
            -scheme ProjeHealthMonitor \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS'
