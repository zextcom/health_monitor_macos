name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    env:
      XCODE_MAJOR: "16"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode 16
        run: |
          LATEST=$(find /Applications -maxdepth 1 -name "Xcode_${XCODE_MAJOR}*.app" -print | sort | tail -n 1)
          if [ -z "$LATEST" ]; then
            echo "Xcode ${XCODE_MAJOR}.x is not installed on this runner" >&2
            exit 1
          fi
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated project is committed
        run: |
          git diff --exit-code -- ProjeHealthMonitor.xcodeproj || {
            echo "ProjeHealthMonitor.xcodeproj is out of sync with project.yml. Run 'xcodegen generate' and commit the result." >&2
            exit 1
          }

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ProjeHealthMonitor.xcodeproj -scheme ProjeHealthMonitor -derivedDataPath build

      - name: Run tests
        run: |
          xcodebuild test \
            -project ProjeHealthMonitor.xcodeproj \
            -scheme ProjeHealthMonitor \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS'
